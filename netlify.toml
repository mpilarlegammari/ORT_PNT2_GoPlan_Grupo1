[build]
  base = "go-plan-pnt2"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.18.0"

[[redirects]]
  from = "/api"
  to = "https://goplan-tp2.onrender.com/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://goplan-tp2.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
